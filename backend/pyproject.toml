[project]
name = "resurface"
version = "0.1.0"
description = "Personal library of highlights with a spaced-repetition daily digest"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.3",
    "itsdangerous>=2.2",
    "redis>=5.0",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "fakeredis[lua]>=2.40.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Cookie"]
